services:
  personal-tracking:
    image: "personal-tracking:latest"
    container_name: personal-tracking
    ports:
      - "8000:8000"
    # DATABASE_URL (and optional overrides) live in .env; never bake them into the image.
    env_file:
      - .env
    environment:
      - TZ=America/New_York
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

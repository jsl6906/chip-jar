version: "3.9"
services:
  personal-tracking:
    image: "personal-tracking:latest"
    container_name: personal-tracking
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/data
      - TZ=America/New_York
    volumes:
      - /mnt/seagate_backup/dockerconfig/personal-tracking/data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport sys, urllib.request\ntry:\n    urllib.request.urlopen('http://localhost:8000/', timeout=3)\nexcept Exception as e:\n    sys.exit(1)\nPY"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      wait_for_seagate_backup:
        condition: service_healthy
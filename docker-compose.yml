version: "3.9"
services:
  personal-tracking:
    image: "personal-tracking:latest"
    container_name: personal-tracking
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/data
      - TZ=America/New_York
      - PYTHONUNBUFFERED=1
    volumes:
      - /mnt/seagate_backup/dockerconfig/personal-tracking/data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      wait_for_seagate_backup:
        condition: service_healthy
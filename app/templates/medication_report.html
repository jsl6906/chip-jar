{% extends 'base.html' %}
{% block content %}
<div class="card">
<h2 style="margin-top:0;">Medication Report</h2>
<form method="get" action="/report/medications/{{ member_id }}">
  <label>Member:
    <select name="member_id" onchange="if(this.value){window.location='/report/medications/'+this.value+'?period='+document.getElementById('period').value}">
      {% for id, name in members %}
      <option value="{{ id }}" {% if id==member_id %}selected{% endif %}>{{ name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Period:
    <select name="period" id="period" onchange="window.location='/report/medications/{{ member_id }}?period='+this.value">
      <option value="week" {% if period=='week' %}selected{% endif %}>Weekly</option>
      <option value="month" {% if period=='month' %}selected{% endif %}>Monthly</option>
    </select>
  </label>
</form>
<table>
  <thead><tr><th>Period</th><th>Medication</th><th>Count</th></tr></thead>
  <tbody>
  {% for period_val, activity_type, count, latest_notes in rows %}
    <tr>
      <td>{{ period_val }}</td>
      <td>{{ activity_type }}{% if latest_notes %}<span class="sub-desc">({{ latest_notes }})</span>{% endif %}</td>
      <td>{{ count }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
<div class="mt-md"><a href="/" style="text-decoration:none;color:var(--primary);font-weight:600;">← Back</a></div>
{% endblock %}
</div>

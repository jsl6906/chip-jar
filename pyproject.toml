[project]
name = "personal-tracking"
version = "0.2.0"
description = "Family chips/allowance/medication tracker (FastAPI + Azure PostgreSQL)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"fastapi",
	"uvicorn[standard]",
	"jinja2",
	"python-multipart",
	"psycopg[binary,pool]",
	"python-dotenv",
	"tzdata",
]

[project.scripts]
personal-tracking = "app.web:run"

[dependency-groups]
# Only needed for the one-time DuckDB -> Postgres migration (uv sync --group migrate)
migrate = ["duckdb"]

[project]
name = "chip-jar"
version = "0.4.0"
description = "ChipJar: family chips/allowance/medication tracker + decision spinner (FastAPI + Azure PostgreSQL)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"fastapi",
	"uvicorn[standard]",
	"jinja2",
	"python-multipart",
	"psycopg[binary,pool]",
	"python-dotenv",
	"tzdata",
	"httpx>=0.28.1",
]

[project.scripts]
chip-jar = "app.web:run"

[dependency-groups]
# Only needed for the one-time DuckDB -> Postgres migration (uv sync --group migrate)
migrate = ["duckdb"]
